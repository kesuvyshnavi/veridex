<!-- server/backend/public/reset-password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light only">
  <title>Veridex — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/app-status.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body data-page="reset-password">

  <nav class="navbar">
    <div class="navbar-inner">
      <div class="navbar-left">
        <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="vrxGradNav" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6D5CFF"/><stop offset="0.5" stop-color="#4F46E5"/><stop offset="1" stop-color="#3730A3"/>
            </linearGradient>
            <radialGradient id="vrxSheenNav" cx="13" cy="9" r="11" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FFFFFF" stop-opacity="0.45"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="40" height="40" rx="11" fill="url(#vrxGradNav)"/>
          <rect width="40" height="40" rx="11" fill="url(#vrxSheenNav)"/>
          <path d="M11.5 20.5L17 26L29 12.5" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="brand-text">
          <span class="navbar-brand">Veridex</span>
          <span class="navbar-tagline">Failure Prediction AI</span>
        </div>
      </div>
      <div class="navbar-right">
        <a href="login.html" class="nav-item">Log in</a>
      </div>
    </div>
  </nav>

  <div class="auth-shell">
    <div class="auth-card">
      <p class="page-eyebrow">Account recovery</p>
      <h1 class="page-title">Set a new password</h1>
      <p class="page-subtitle">Choose a new password for your account.</p>

      <form id="resetForm" class="project-form" novalidate>
        <div class="form-group">
          <label for="password">New Password</label>
          <div class="password-input-wrap">
            <input type="password" id="password" name="password" placeholder="At least 8 characters" />
            <button type="button" class="password-toggle-btn" data-target="password" aria-label="Show password">
              <svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.9 19.9 0 0 1 4.22-5.44M9.9 4.24A9.6 9.6 0 0 1 12 4c7 0 11 8 11 8a19.8 19.8 0 0 1-2.06 3.06M1 1l22 22" /><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
            </button>
          </div>
          <span class="error-msg" id="err_password"></span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <div class="password-input-wrap">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your new password" />
            <button type="button" class="password-toggle-btn" data-target="confirmPassword" aria-label="Show password">
              <svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.9 19.9 0 0 1 4.22-5.44M9.9 4.24A9.6 9.6 0 0 1 12 4c7 0 11 8 11 8a19.8 19.8 0 0 1-2.06 3.06M1 1l22 22" /><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
            </button>
          </div>
          <span class="error-msg" id="err_confirmPassword"></span>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
          <span>Reset Password</span>
        </button>
      </form>

      <div id="formErrorBox" class="form-error-box hidden"></div>
      <div id="formSuccessBox" class="form-error-box hidden" style="background:#ECFDF3;border-color:#CDF0DA;color:#16A34A;"></div>
    </div>
  </div>

  <script src="/js/auth-common.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
